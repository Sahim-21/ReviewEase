name: Keep API warm

# Render's free tier sleeps after ~15 minutes without traffic, and the first diner after that
# waits ~50 seconds. Pinging /health keeps the API awake during the day (IST 09:00-23:59).
# GitHub may delay scheduled runs by a few minutes; that is fine for this purpose.
# Set the API URL as a repository variable: Settings → Secrets and variables → Actions →
# Variables → API_HEALTH_URL = https://<your-api>.onrender.com/health

on:
  schedule:
    - cron: "*/10 3-18 * * *" # UTC; 03:30-18:29 UTC ≈ 09:00-23:59 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --silent --show-error --max-time 90 --retry 2 "$API_HEALTH_URL"
