services:
  db:
    image: postgres:16-alpine
    container_name: reviewease-db
    environment:
      POSTGRES_USER: reviewease
      POSTGRES_PASSWORD: reviewease
      POSTGRES_DB: reviewease
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewease -d reviewease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
